name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Lint, test, and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Pin phase 5.14.8 leader-first LLDB toolpack
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          OLD_VERSION = "ndk-r27d-clang-r522817d_autocrack-1.0.0"
          NEW_VERSION = "android-llvm-r522817_autocrack-1.1.0-leader-first"
          OLD_PAYLOAD_SHA = "2cc969ff785e8c0c3d4473649edaaf18f64faae4c7e016941dd0c0944944a14a"
          NEW_PAYLOAD_SHA = "361279dffd0bfe9472ab44adf4a53197002f7c15ac72f6a732f0332f58097805"
          OLD_PAYLOAD_SIZE = "27_698_528L"
          NEW_PAYLOAD_SIZE = "28_392_626L"
          OLD_SOURCE_VERSION = "ndk-r27d-clang-r522817d"
          NEW_SOURCE_VERSION = "android-llvm-r522817-autocrack-leader-first"
          OLD_SOURCE_URL = "https://github.com/android/ndk/releases/tag/r27d"
          NEW_SOURCE_URL = "https://android.googlesource.com/toolchain/llvm-project/+/d8003a456d14a3deb8054cdaa529ffbf02d9b262"
          OLD_BINARY_SHA = "ff96d83baa872b2226bb1f4f38cd38aa2622416722fb76543cc536edfeea3018"
          NEW_BINARY_SHA = "f94f7943e79cb45cba712583264007cca6553745cf9f2576ed13697ad80894e8"

          def replace_exact(path, old, new, expected):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(
                      f"{path}: expected {expected} occurrence(s) of {old!r}, found {actual}"
                  )
              p.write_text(text.replace(old, new), encoding="utf-8")

          trust = "app/src/main/java/com/luckylca/autocrack/runtime/BuiltInToolpackTrustPolicy.kt"
          replace_exact(trust, OLD_VERSION, NEW_VERSION, 1)
          replace_exact(trust, OLD_PAYLOAD_SHA, NEW_PAYLOAD_SHA, 1)
          replace_exact(trust, OLD_PAYLOAD_SIZE, NEW_PAYLOAD_SIZE, 1)
          replace_exact(trust, OLD_SOURCE_VERSION, NEW_SOURCE_VERSION, 1)
          replace_exact(trust, OLD_SOURCE_URL, NEW_SOURCE_URL, 1)
          replace_exact(trust, OLD_BINARY_SHA, NEW_BINARY_SHA, 1)

          test = "app/src/test/java/com/luckylca/autocrack/runtime/AndroidLldbToolpackTrustPolicyTest.kt"
          replace_exact(test, OLD_VERSION, NEW_VERSION, 1)
          replace_exact(test, OLD_PAYLOAD_SHA, NEW_PAYLOAD_SHA, 1)
          replace_exact(test, OLD_PAYLOAD_SIZE, NEW_PAYLOAD_SIZE, 1)
          replace_exact(test, OLD_SOURCE_VERSION, NEW_SOURCE_VERSION, 1)
          replace_exact(test, OLD_SOURCE_URL, NEW_SOURCE_URL, 1)
          replace_exact(test, OLD_BINARY_SHA, NEW_BINARY_SHA, 1)

          manager = "app/src/main/java/com/luckylca/autocrack/runtime/HostDebuggerSessionManager.kt"
          replace_exact(manager, OLD_VERSION, NEW_VERSION, 1)

          catalog = "app/src/main/assets/runtime/dynamic-host-tool-catalog-v1.json"
          replace_exact(catalog, '"catalogVersion": "0.5.14.5"', '"catalogVersion": "0.5.14.8"', 1)
          replace_exact(catalog, OLD_VERSION, NEW_VERSION, 2)

          gradle = "app/build.gradle.kts"
          replace_exact(gradle, "versionCode = 42", "versionCode = 43", 1)
          replace_exact(
              gradle,
              'versionName = "0.5.14.7-phase5.14-server-ptrace-trace"',
              'versionName = "0.5.14.8-phase5.14-leader-first-lldb"',
              1,
          )
          PY

          ! grep -R -F "ndk-r27d-clang-r522817d_autocrack-1.0.0" \
            app/src/main app/src/test app/build.gradle.kts
          grep -R -F "android-llvm-r522817_autocrack-1.1.0-leader-first" \
            app/src/main app/src/test
          grep -F 'versionName = "0.5.14.8-phase5.14-leader-first-lldb"' app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK, and CMake packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.3.13750724" \
            "cmake;3.22.1"

      - name: Lint, unit test, and assemble debug APK
        run: gradle --no-daemon --stacktrace clean lintDebug testDebugUnitTest assembleDebug

      - name: Verify native PTY library is packaged
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F "lib/arm64-v8a/libautocrack_pty.so"

      - name: Verify dynamic host catalogs are packaged
        run: |
          unzip -p app/build/outputs/apk/debug/app-debug.apk \
            assets/runtime/dynamic-host-tool-catalog-v1.json \
            | jq -e '
                .catalogVersion == "0.5.14.8" and
                .safetyBoundary.defaultOperationMode == "read_only" and
                .safetyBoundary.attachAllowed == true and
                .safetyBoundary.attachRequiresExplicitAuthorization == true and
                .safetyBoundary.debuggerExecutionControlAllowed == true and
                .safetyBoundary.debuggerExecutionControlRequiresExplicitAuthorization == true and
                .safetyBoundary.registerReadAllowed == true and
                .safetyBoundary.registerWriteAllowed == false and
                .safetyBoundary.memoryReadAllowed == true and
                .safetyBoundary.memoryWriteAllowed == false and
                .safetyBoundary.breakpointAllowed == false and
                .safetyBoundary.rawDebuggerPacketAllowed == false and
                .safetyBoundary.signalsAllowed == false and
                .safetyBoundary.injectionAllowed == false and
                .safetyBoundary.orphanDebuggerRecoveryAllowed == true and
                .safetyBoundary.orphanDebuggerRecoveryRequiresExactAuthorization == true and
                ([.tools[].id] | index("host.debugger.lldb_server_session") != null) and
                ([.tools[].id] | index("host.debugger.client_control") != null) and
                ([.tools[].id] | index("host.debugger.orphan_recovery") != null) and
                (.tools[] | select(.id == "host.debugger.lldb_server_session") |
                  .networkScope == "127.0.0.1 only" and
                  .networkAddressFamily == "IPv4" and
                  .changesTargetState == false and
                  .requiresToolpack.version == "android-llvm-r522817_autocrack-1.1.0-leader-first" and
                  ([.guarantees[]] | index("start lldb-server gdbserver on IPv4 loopback without --attach so it reaches LISTEN before target attach") != null) and
                  ([.guarantees[]] | index("verify the 127.0.0.1 listener socket inode is owned by the verified helper PID") != null) and
                  ([.guarantees[]] | index("create the helper PID file under controller ownership before the root helper writes its PID") != null)) and
                (.tools[] | select(.id == "host.debugger.client_control") |
                  .confirmation == "exact_target_phrase" and
                  .authorizationTemplate == "CONTROL <packageName> <pid>" and
                  .networkScope == "127.0.0.1 only" and
                  .networkAddressFamily == "IPv4" and
                  ([.operations[].id] | index("typed_attach") != null) and
                  (.operations[] | select(.id == "typed_attach") | .packetShape == "vAttach;<hexPid>") and
                  ([.guarantees[]] | index("require a verified helper-owned LISTEN socket before CONTROL can connect") != null) and
                  ([.guarantees[]] | index("after the TCP transport is accepted do not require the single-client LISTEN socket to remain present") != null) and
                  ([.guarantees[]] | index("post-accept revalidate the same live verified helper, same package/PID and TracerPid=0 immediately before typed vAttach") != null) and
                  ([.guarantees[]] | index("encode only the already authorized session PID into the fixed typed vAttach packet") != null) and
                  ([.guarantees[]] | index("no arbitrary raw gdb-remote packet adapter") != null) and
                  ([.operations[].id] | index("register_read") != null) and
                  ([.operations[].id] | index("memory_read") != null) and
                  ([.operations[].id] | index("continue") != null) and
                  ([.operations[].id] | index("step") != null) and
                  ([.operations[].id] | index("interrupt") != null)) and
                (.tools[] | select(.id == "host.debugger.orphan_recovery") |
                  .confirmation == "exact_target_and_tracer_phrase" and
                  .authorizationTemplate == "RECOVER <packageName> <pid> <tracerPid>" and
                  .requiresToolpack.version == "android-llvm-r522817_autocrack-1.1.0-leader-first" and
                  ([.guarantees[]] | index("accept only a trusted IPv4 loopback gdbserver command from either legacy --attach or typed client-driven attach sessions") != null) and
                  ([.guarantees[]] | index("send TERM only to the verified LLDB helper and never to the target PID") != null) and
                  ([.guarantees[]] | index("never escalate recovery to SIGKILL") != null))
              ' >/dev/null

      - name: Prepare distributable APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AutoCrackApp-0.5.14.8-leader-first-lldb-debug.apk
          cd dist
          sha256sum AutoCrackApp-0.5.14.8-leader-first-lldb-debug.apk \
            > AutoCrackApp-0.5.14.8-leader-first-lldb-debug.apk.sha256

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoCrackApp-0.5.14.8-leader-first-lldb-debug
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AutoCrackApp-0.5.14.8-leader-first-lldb-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
