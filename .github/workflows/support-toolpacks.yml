name: Build support and S+A toolpacks

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/support-toolpacks.yml'
      - 'toolpacks/android-host-shell/**'
      - 'toolpacks/android-pcap-helper/**'
      - 'toolpacks/pcap-analysis/**'
      - 'toolpacks/_shared/**'
      - 'toolpacks/apkid/**'
      - 'toolpacks/androguard/**'
      - 'toolpacks/jnitrace/**'
      - 'toolpacks/uiautomator2/**'
      - 'toolpacks/mitmproxy/**'
      - 'toolpacks/capa/**'
      - 'toolpacks/blutter/**'
      - 'toolpacks/frida-il2cpp-bridge/**'
      - 'scripts/download_locked_wheelhouse.py'

permissions:
  contents: read

concurrency:
  group: support-toolpacks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-host-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build twice and verify deterministic payload
        run: |
          set -euxo pipefail
          python3 toolpacks/android-host-shell/build_toolpack.py | tee /tmp/first.txt
          cp toolpacks/android-host-shell/dist/payload.sha256 /tmp/payload.first.sha256
          cp toolpacks/android-host-shell/dist/payload.size /tmp/payload.first.size
          python3 toolpacks/android-host-shell/build_toolpack.py | tee /tmp/second.txt
          cmp /tmp/payload.first.sha256 toolpacks/android-host-shell/dist/payload.sha256
          cmp /tmp/payload.first.size toolpacks/android-host-shell/dist/payload.size
          unzip -t toolpacks/android-host-shell/dist/AutoCrackApp-android-host-shell-android-host-shell-1.0.3-toolpack.zip
          python3 toolpacks/android-host-shell/dist/payload/bin/android-shell --self-test | grep -Fx ANDROID_HOST_SHELL_CLIENT_OK
      - uses: actions/upload-artifact@v4
        with:
          name: AutoCrackApp-android-host-shell-toolpack
          path: |
            toolpacks/android-host-shell/dist/*toolpack.zip
            toolpacks/android-host-shell/dist/*toolpack.zip.sha256
            toolpacks/android-host-shell/dist/manifest.json
            toolpacks/android-host-shell/dist/payload.sha256
            toolpacks/android-host-shell/dist/payload.size
          if-no-files-found: error
          retention-days: 14

  pcap-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build twice and verify deterministic payload
        run: |
          set -euxo pipefail
          python3 toolpacks/pcap-analysis/build_toolpack.py --output-dir dist/pcap-analysis | tee /tmp/first.txt
          cp dist/pcap-analysis/payload.sha256 /tmp/payload.first.sha256
          cp dist/pcap-analysis/payload.size /tmp/payload.first.size
          python3 toolpacks/pcap-analysis/build_toolpack.py --output-dir dist/pcap-analysis-rerun | tee /tmp/second.txt
          cmp /tmp/payload.first.sha256 dist/pcap-analysis-rerun/payload.sha256
          cmp /tmp/payload.first.size dist/pcap-analysis-rerun/payload.size
          unzip -t dist/pcap-analysis/AutoCrackApp-rootfs-pcap-analysis-toolpack.zip
          python3 toolpacks/pcap-analysis/bin/pcap-summary --self-test | grep -Fx PCAP_SUMMARY_SELF_TEST_OK
      - uses: actions/upload-artifact@v4
        with:
          name: AutoCrackApp-rootfs-pcap-analysis-toolpack
          path: |
            dist/pcap-analysis/*toolpack.zip
            dist/pcap-analysis/*toolpack.zip.sha256
            dist/pcap-analysis/manifest.json
            dist/pcap-analysis/payload.sha256
            dist/pcap-analysis/payload.size
          if-no-files-found: error
          retention-days: 14


  apkid:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Download pinned Linux ARM64 APKiD wheels
        run: |
          set -euxo pipefail
          mkdir -p dist/apkid-wheelhouse
          python3 -m pip download \
            --only-binary=:all: \
            --platform manylinux2014_aarch64 \
            --python-version 311 \
            --implementation cp \
            --abi cp311 \
            --dest dist/apkid-wheelhouse \
            apkid==3.1.0
          printf '%s  %s\n' \
            02e349865bc1005ae2beb27fbb58acdeabb56d1a60ce723c344cde1bb32896f8 \
            dist/apkid-wheelhouse/apkid-3.1.0-py2.py3-none-any.whl | sha256sum -c -
          printf '%s  %s\n' \
            a0176641510cff158ab56fd60f8d3b67ffd804441def44df53a87a0632090225 \
            dist/apkid-wheelhouse/yara_python_dex-1.0.7-cp311-cp311-manylinux_2_17_aarch64.manylinux2014_aarch64.whl | sha256sum -c -
      - name: Build twice and verify deterministic APKiD Toolpack
        run: |
          set -euxo pipefail
          python3 toolpacks/apkid/build_toolpack.py \
            --wheelhouse dist/apkid-wheelhouse \
            --output-dir dist/apkid
          python3 toolpacks/apkid/build_toolpack.py \
            --wheelhouse dist/apkid-wheelhouse \
            --output-dir dist/apkid-rerun
          cmp dist/apkid/payload.sha256 dist/apkid-rerun/payload.sha256
          cmp dist/apkid/payload.size dist/apkid-rerun/payload.size
          unzip -t dist/apkid/*toolpack.zip
      - name: Run APKiD self-tests in Debian Bookworm ARM64
        run: |
          set -euxo pipefail
          mkdir -p dist/apkid-unpack
          unzip -q dist/apkid/*toolpack.zip -d dist/apkid-unpack
          docker run --rm --platform linux/arm64 \
            -v "$PWD/dist/apkid-unpack:/input:ro" \
            debian:bookworm-slim /bin/bash -euxc '
              apt-get update
              apt-get install -y --no-install-recommends python3 unzip
              mkdir -p /opt/autocrack/toolpacks/active/apkid
              unzip -q /input/payload.zip -d /opt/autocrack/toolpacks/active/apkid
              chmod 0755 /opt/autocrack/toolpacks/active/apkid/bin/apkid
              export PATH="/opt/autocrack/toolpacks/active/apkid/bin:$PATH"
              apkid --help | grep -F "APKiD - Android Application Identifier v3.1.0"
              PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=/opt/autocrack/toolpacks/active/apkid/python \
                python3 -B -c "import apkid,apkid.apkid,apkid.rules,yara; print(\"AUTOCRACK_APKID_API_OK\")" \
                | grep -Fx AUTOCRACK_APKID_API_OK
            '
      - uses: actions/upload-artifact@v4
        with:
          name: AutoCrackApp-apkid-toolpack
          path: |
            dist/apkid/*toolpack.zip
            dist/apkid/*toolpack.zip.sha256
            dist/apkid/manifest.json
            dist/apkid/payload.sha256
            dist/apkid/payload.size
          if-no-files-found: error
          retention-days: 14

  androguard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Restore the exact Androguard ARM64 wheelhouse
        run: |
          set -euxo pipefail
          python3 scripts/download_locked_wheelhouse.py             --lock toolpacks/androguard/wheelhouse.lock.json             --output-dir dist/androguard-wheelhouse
      - name: Build twice and verify deterministic Androguard Toolpack
        run: |
          set -euxo pipefail
          python3 toolpacks/androguard/build_toolpack.py             --wheelhouse dist/androguard-wheelhouse             --output-dir dist/androguard
          python3 toolpacks/androguard/build_toolpack.py             --wheelhouse dist/androguard-wheelhouse             --output-dir dist/androguard-rerun
          cmp dist/androguard/payload.sha256 dist/androguard-rerun/payload.sha256
          cmp dist/androguard/payload.size dist/androguard-rerun/payload.size
          cmp             dist/androguard/AutoCrackApp-androguard-androguard-4.1.4_autocrack-1.0.0-toolpack.zip             dist/androguard-rerun/AutoCrackApp-androguard-androguard-4.1.4_autocrack-1.0.0-toolpack.zip
          unzip -t dist/androguard/AutoCrackApp-androguard-androguard-4.1.4_autocrack-1.0.0-toolpack.zip
      - name: Run full Androguard API smoke in Debian Bookworm ARM64
        run: |
          set -euxo pipefail
          mkdir -p dist/androguard-unpack
          unzip -q             dist/androguard/AutoCrackApp-androguard-androguard-4.1.4_autocrack-1.0.0-toolpack.zip             -d dist/androguard-unpack
          docker run --rm --platform linux/arm64             -v "$PWD/dist/androguard-unpack:/input:ro"             debian:bookworm-slim /bin/bash -euxc '
              apt-get update
              apt-get install -y --no-install-recommends python3 unzip
              mkdir -p /opt/autocrack/toolpacks/active/androguard
              unzip -q /input/payload.zip -d /opt/autocrack/toolpacks/active/androguard
              chmod 0755 /opt/autocrack/toolpacks/active/androguard/bin/androguard
              export PATH="/opt/autocrack/toolpacks/active/androguard/bin:$PATH"
              export PYTHONPATH=/opt/autocrack/toolpacks/active/androguard/python
              androguard --help | grep -F "Usage:"
              python3 -B -c "import androguard; from androguard.misc import AnalyzeAPK; from androguard.core.apk import APK; from androguard.core.axml import AXMLPrinter,ARSCParser; print(androguard.__version__)"                 | grep -Fx 4.1.4
            '
      - uses: actions/upload-artifact@v4
        with:
          name: AutoCrackApp-androguard-toolpack
          path: |
            dist/androguard/*toolpack.zip
            dist/androguard/*toolpack.zip.sha256
            dist/androguard/manifest.json
            dist/androguard/payload.sha256
            dist/androguard/payload.size
          if-no-files-found: error
          retention-days: 14
  jnitrace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JNITRACE_VERSION: "3.3.1"
      FRIDA_VERSION: "17.17.0"
      FRIDA_PYTHON_WHEEL_SHA256: "82ddfa720588a0429fd3dd8e75ccf5c722d57da3d5544d1ba420741c032ba7a8"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Fetch pinned jnitrace build inputs and Frida ARM64 binding
        run: |
          set -euxo pipefail
          mkdir -p dist/jnitrace-inputs
          curl --fail --location --retry 4 --retry-all-errors             -o dist/jnitrace-inputs/jnitrace-3.3.1.tar.gz             https://files.pythonhosted.org/packages/00/d9/25136bf8b76a99c8f93843f75771d2b19b29004d322b94bf565773120c8b/jnitrace-3.3.1.tar.gz
          curl --fail --location --retry 4 --retry-all-errors             -o dist/jnitrace-inputs/colorama-0.4.6-py2.py3-none-any.whl             https://files.pythonhosted.org/packages/d1/d6/3965ed04c63042e047cb6a3e6ed1a63a35087b6a609aa3a15ed8ac56c221/colorama-0.4.6-py2.py3-none-any.whl
          curl --fail --location --retry 4 --retry-all-errors             -o dist/jnitrace-inputs/hexdump-3.3.zip             https://files.pythonhosted.org/packages/55/b3/279b1d57fa3681725d0db8820405cdcb4e62a9239c205e4ceac4391c78e4/hexdump-3.3.zip
          curl --fail --location --retry 4 --retry-all-errors             -o dist/jnitrace-inputs/setuptools-80.9.0-py3-none-any.whl             https://files.pythonhosted.org/packages/a3/dc/17031897dae0efacfea57dfd3a82fdd2a2aeb58e0ff71b77b87e44edc772/setuptools-80.9.0-py3-none-any.whl
          printf '%s  %s\n' 6fc6b39a561b34415250ddcc8eaa54a8d9414ca4f42532e909506493d471efed dist/jnitrace-inputs/jnitrace-3.3.1.tar.gz | sha256sum -c -
          printf '%s  %s\n' 4f1d9991f5acc0ca119f9d443620b77f9d6b33703e51011c16baf57afb285fc6 dist/jnitrace-inputs/colorama-0.4.6-py2.py3-none-any.whl | sha256sum -c -
          printf '%s  %s\n' d781a43b0c16ace3f9366aade73e8ad3a7bd5137d58f0b45ab2d3f54876f20db dist/jnitrace-inputs/hexdump-3.3.zip | sha256sum -c -
          printf '%s  %s\n' 062d34222ad13e0cc312a4c02d73f059e86a4acbfbdea8f8f76b28c99f306922 dist/jnitrace-inputs/setuptools-80.9.0-py3-none-any.whl | sha256sum -c -
          python3 -m pip download --disable-pip-version-check --no-deps --only-binary=:all:             --platform manylinux_2_17_aarch64 --python-version 311 --implementation cp --abi abi3             "frida==${FRIDA_VERSION}" --dest dist/jnitrace-inputs
          FRIDA_WHEEL="$(find dist/jnitrace-inputs -maxdepth 1 -type f -name 'frida-*-manylinux_2_17_aarch64.whl' -print -quit)"
          test -n "$FRIDA_WHEEL"
          printf '%s  %s\n' "$FRIDA_PYTHON_WHEEL_SHA256" "$FRIDA_WHEEL" | sha256sum -c -
      - name: Build twice and verify deterministic jnitrace Toolpack
        run: |
          set -euxo pipefail
          build_one() {
            out="$1"
            python3 toolpacks/jnitrace/build_toolpack.py               --jnitrace-sdist dist/jnitrace-inputs/jnitrace-3.3.1.tar.gz               --colorama-wheel dist/jnitrace-inputs/colorama-0.4.6-py2.py3-none-any.whl               --hexdump-zip dist/jnitrace-inputs/hexdump-3.3.zip               --setuptools-wheel dist/jnitrace-inputs/setuptools-80.9.0-py3-none-any.whl               --output-dir "$out"
          }
          build_one dist/jnitrace
          build_one dist/jnitrace-rerun
          cmp dist/jnitrace/payload.sha256 dist/jnitrace-rerun/payload.sha256
          cmp dist/jnitrace/payload.size dist/jnitrace-rerun/payload.size
          cmp dist/jnitrace/*toolpack.zip dist/jnitrace-rerun/*toolpack.zip
          grep -Fx 92efc9377bbc3c2f52649675560908ec16573485e3df7641a15c42e9a61f35e3 dist/jnitrace/payload.sha256
          grep -Fx 4674924 dist/jnitrace/payload.size
          unzip -t dist/jnitrace/*toolpack.zip
      - name: Run jnitrace + production Frida integration smoke on Debian Bookworm ARM64
        run: |
          set -euxo pipefail
          rm -rf dist/jnitrace-unpack dist/frida-python
          mkdir -p dist/jnitrace-unpack dist/frida-python
          unzip -q dist/jnitrace/*toolpack.zip -d dist/jnitrace-unpack
          FRIDA_WHEEL="$(find dist/jnitrace-inputs -maxdepth 1 -type f -name 'frida-*-manylinux_2_17_aarch64.whl' -print -quit)"
          unzip -q "$FRIDA_WHEEL" -d dist/frida-python
          docker run --rm --platform linux/arm64             -v "$PWD/dist/jnitrace-unpack:/jnitrace:ro"             -v "$PWD/dist/frida-python:/frida-python:ro"             debian:bookworm-slim /bin/bash -euxc '
              trap "rc=\$?; echo \"::error title=jnitrace-arm64-smoke::\${current:-unknown} failed (rc=\$rc)\"; exit \$rc" ERR
              current=apt-update
              apt-get update
              current=apt-install
              apt-get install -y --no-install-recommends python3 unzip
              mkdir -p /opt/autocrack/toolpacks/active/jnitrace
              mkdir -p /opt/autocrack/toolpacks/active/android-frida/python
              unzip -q /jnitrace/payload.zip -d /opt/autocrack/toolpacks/active/jnitrace
              cp -a /frida-python/. /opt/autocrack/toolpacks/active/android-frida/python/
              chmod 0755 /opt/autocrack/toolpacks/active/jnitrace/bin/jnitrace
              export PATH="/opt/autocrack/toolpacks/active/jnitrace/bin:$PATH"
              current=version
              jnitrace --version | grep -F "jnitrace 3.3.1"
              current=help-remote
              jnitrace --help | grep -F -- "--remote"
              current=engine-js
              test -s /opt/autocrack/toolpacks/active/jnitrace/python/jnitrace/build/jnitrace.js
              current=python-import
              PYTHONPATH=/opt/autocrack/toolpacks/active/jnitrace/python:/opt/autocrack/toolpacks/active/android-frida/python                 python3 -B -c "import frida, jnitrace.jnitrace; print(frida.__version__); print(\"AUTOCRACK_JNITRACE_IMPORT_OK\")"                 | grep -F AUTOCRACK_JNITRACE_IMPORT_OK
            '
      - uses: actions/upload-artifact@v4
        with:
          name: AutoCrackApp-jnitrace-toolpack
          path: |
            dist/jnitrace/*toolpack.zip
            dist/jnitrace/*toolpack.zip.sha256
            dist/jnitrace/manifest.json
            dist/jnitrace/payload.sha256
            dist/jnitrace/payload.size
          if-no-files-found: error
          retention-days: 14

  uiautomator2:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Fetch pinned uiautomator2 and adbutils upstream artifacts
        run: |
          set -euxo pipefail
          mkdir -p dist/uiautomator2-inputs
          curl --fail --location --retry 4 --retry-all-errors             -o dist/uiautomator2-inputs/uiautomator2-3.7.0-py3-none-any.whl             https://files.pythonhosted.org/packages/55/23/a5f93de8bb197ae2d2d0185c2c13d4b36ae7f18215e3e599e217f8e90e0d/uiautomator2-3.7.0-py3-none-any.whl
          curl --fail --location --retry 4 --retry-all-errors             -o dist/uiautomator2-inputs/adbutils-2.11.0.tar.gz             https://files.pythonhosted.org/packages/b6/80/c0cc9b47c8273f1f9c5f00577605f9c5903acf74cd80569fa1cb1072fc9f/adbutils-2.11.0.tar.gz
          printf '%s  %s\n' 731bf4e26e35cd440cd165b399b8a4d4b795178d78b9243769e336aee6dce985             dist/uiautomator2-inputs/uiautomator2-3.7.0-py3-none-any.whl | sha256sum -c -
          printf '%s  %s\n' 7621182b219163bbfd16a240aa504c7834cf377d2bdc3f10452d5e8266fa7f87             dist/uiautomator2-inputs/adbutils-2.11.0.tar.gz | sha256sum -c -
          python3 scripts/download_locked_wheelhouse.py             --lock toolpacks/uiautomator2/wheelhouse.lock.json             --output-dir dist/uiautomator2-wheelhouse
      - name: Build twice and verify deterministic uiautomator2 Toolpack
        run: |
          set -euxo pipefail
          build_one() {
            out="$1"
            python3 toolpacks/uiautomator2/build_toolpack.py               --uiautomator2-wheel dist/uiautomator2-inputs/uiautomator2-3.7.0-py3-none-any.whl               --adbutils-sdist dist/uiautomator2-inputs/adbutils-2.11.0.tar.gz               --wheelhouse dist/uiautomator2-wheelhouse               --output-dir "$out"
          }
          build_one dist/uiautomator2
          build_one dist/uiautomator2-rerun
          cmp dist/uiautomator2/payload.sha256 dist/uiautomator2-rerun/payload.sha256
          cmp dist/uiautomator2/payload.size dist/uiautomator2-rerun/payload.size
          cmp dist/uiautomator2/*toolpack.zip dist/uiautomator2-rerun/*toolpack.zip
          grep -Fx 8765ee4b3a1670985f803db05284ab92499a7797e2d64468b7cb0da94e0ff4ca dist/uiautomator2/payload.sha256
          grep -Fx 40688700 dist/uiautomator2/payload.size
          unzip -t dist/uiautomator2/*toolpack.zip
      - name: Run full uiautomator2 CLI and Python API smoke in Debian Bookworm ARM64
        run: |
          set -euxo pipefail
          rm -rf dist/uiautomator2-unpack
          mkdir -p dist/uiautomator2-unpack
          unzip -q dist/uiautomator2/*toolpack.zip -d dist/uiautomator2-unpack
          docker run --rm --platform linux/arm64             -v "$PWD/dist/uiautomator2-unpack:/input:ro"             debian:bookworm-slim /bin/bash -euxc '
              trap "rc=\$?; echo \"::error title=uiautomator2-arm64-smoke::\${current:-unknown} failed (rc=\$rc)\"; exit \$rc" ERR
              current=apt-update
              apt-get update
              current=apt-install
              apt-get install -y --no-install-recommends python3 unzip adb
              mkdir -p /opt/autocrack/toolpacks/active/uiautomator2
              unzip -q /input/payload.zip -d /opt/autocrack/toolpacks/active/uiautomator2
              chmod 0755 /opt/autocrack/toolpacks/active/uiautomator2/bin/uiautomator2
              chmod 0755 /opt/autocrack/toolpacks/active/uiautomator2/bin/u2cli
              export PATH="/opt/autocrack/toolpacks/active/uiautomator2/bin:$PATH"
              export PYTHONDONTWRITEBYTECODE=1
              current=adb
              adb version
              current=version
              uiautomator2 version | grep -F "uiautomator2 version: 3.7.0"
              current=help-copy-assets
              uiautomator2 --help | grep -F "copy-assets"
              current=u2cli-help
              u2cli --help | grep -F "Usage:"
              current=python-api
              PYTHONPATH=/opt/autocrack/toolpacks/active/uiautomator2/python                 python3 -B -c "import importlib.metadata,pathlib,shutil,uiautomator2,adbutils; p=pathlib.Path(uiautomator2.__file__).parent/\"assets\"; assert (p/\"app-uiautomator.apk\").is_file(); assert (p/\"u2.jar\").is_file(); assert shutil.which(\"adb\"); print(importlib.metadata.version(\"uiautomator2\")); print(importlib.metadata.version(\"adbutils\")); print(\"AUTOCRACK_UIAUTOMATOR2_API_OK\")"                 | grep -F AUTOCRACK_UIAUTOMATOR2_API_OK
            '
      - uses: actions/upload-artifact@v4
        with:
          name: AutoCrackApp-uiautomator2-toolpack
          path: |
            dist/uiautomator2/*toolpack.zip
            dist/uiautomator2/*toolpack.zip.sha256
            dist/uiautomator2/manifest.json
            dist/uiautomator2/payload.sha256
            dist/uiautomator2/payload.size
          if-no-files-found: error
          retention-days: 14

  mitmproxy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Fetch and verify official mitmproxy Linux aarch64 release
        run: |
          set -euxo pipefail
          mkdir -p dist/mitmproxy-inputs
          curl --fail --location --retry 4 --retry-all-errors             -o dist/mitmproxy-inputs/mitmproxy-12.2.3-linux-aarch64.tar.gz             https://downloads.mitmproxy.org/12.2.3/mitmproxy-12.2.3-linux-aarch64.tar.gz
          printf '%s  %s\n' b358643a6c4f4b39e33d985350f660b724fece95687d7daa899ef0c4e211f681             dist/mitmproxy-inputs/mitmproxy-12.2.3-linux-aarch64.tar.gz | sha256sum -c -
      - name: Build twice and verify deterministic mitmproxy Toolpack
        run: |
          set -euxo pipefail
          python3 toolpacks/mitmproxy/build_toolpack.py             --archive dist/mitmproxy-inputs/mitmproxy-12.2.3-linux-aarch64.tar.gz             --output-dir dist/mitmproxy
          python3 toolpacks/mitmproxy/build_toolpack.py             --archive dist/mitmproxy-inputs/mitmproxy-12.2.3-linux-aarch64.tar.gz             --output-dir dist/mitmproxy-rerun
          cmp dist/mitmproxy/payload.sha256 dist/mitmproxy-rerun/payload.sha256
          cmp dist/mitmproxy/payload.size dist/mitmproxy-rerun/payload.size
