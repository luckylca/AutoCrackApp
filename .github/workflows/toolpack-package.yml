name: Build reverse-analysis toolpack

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolpack-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-apk-dex-toolpack:
    name: Build verified JADX and Apktool package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      JADX_VERSION: "1.5.6"
      JADX_SHA256: "545ea2be9c242511bc145755cf4bda2485ade42966e096f8b4d3da2a230e8974"
      APKTOOL_VERSION: "3.0.3"
      APKTOOL_SHA256: "dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423"
      EXPECTED_PAYLOAD_SHA256: "b81d5ccf6d9730ab7864ad6380696a88f1e7aa7f97a7f34bd578fdb9572187b9"
      EXPECTED_PAYLOAD_SIZE: "93755288"
      TOOLPACK_ID: apk-dex-static

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl jq unzip zip

      - name: Download and verify pinned upstream releases
        run: |
          set -euxo pipefail
          mkdir -p dist/sources dist/payload/bin dist/payload/lib/jadx dist/payload/lib/apktool

          JADX_URL="https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip"
          APKTOOL_URL="https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar"

          curl --fail --location --retry 4 --retry-all-errors \
            --output dist/sources/jadx.zip "$JADX_URL"
          curl --fail --location --retry 4 --retry-all-errors \
            --output dist/sources/apktool.jar "$APKTOOL_URL"

          printf '%s  %s\n' "$JADX_SHA256" dist/sources/jadx.zip | sha256sum --check --strict -
          printf '%s  %s\n' "$APKTOOL_SHA256" dist/sources/apktool.jar | sha256sum --check --strict -
          unzip -t dist/sources/jadx.zip
          jar tf dist/sources/apktool.jar >/dev/null

          printf '%s' "$JADX_URL" > dist/sources/jadx.url
          printf '%s' "$APKTOOL_URL" > dist/sources/apktool.url

      - name: Build canonical deterministic Toolpack
        run: |
          set -euxo pipefail
          python3 toolpacks/apk-dex-static/build_toolpack.py \
            --jadx-zip dist/sources/jadx.zip \
            --apktool-jar dist/sources/apktool.jar \
            --output-dir dist/canonical

          cp dist/canonical/manifest.json dist/manifest.json
          cp dist/canonical/payload.zip dist/payload.zip
          CANONICAL_PACKAGE=$(find dist/canonical -maxdepth 1 -type f -name 'AutoCrackApp-apk-dex-static-*-toolpack.zip' -print -quit)
          test -n "$CANONICAL_PACKAGE"
          cp "$CANONICAL_PACKAGE" dist/AutoCrackApp-apk-dex-static-toolpack.zip
          sha256sum dist/AutoCrackApp-apk-dex-static-toolpack.zip \
            > dist/AutoCrackApp-apk-dex-static-toolpack.zip.sha256

          ACTUAL_PAYLOAD_SHA256=$(sha256sum dist/payload.zip | awk '{print $1}')
          ACTUAL_PAYLOAD_SIZE=$(stat -c '%s' dist/payload.zip)
          test "$ACTUAL_PAYLOAD_SHA256" = "$EXPECTED_PAYLOAD_SHA256"
          test "$ACTUAL_PAYLOAD_SIZE" = "$EXPECTED_PAYLOAD_SIZE"
          jq -e '.schemaVersion == 1' dist/manifest.json >/dev/null
          jq -e '.version == "jadx-1.5.6_apktool-3.0.3_autocrack-1.0.1"' dist/manifest.json >/dev/null
          jq -e '.requiredPaths | index("SKILL.md") != null' dist/manifest.json >/dev/null
          jq -e '.selfTests | map(.id) | index("jadx-mobile-policy") != null' dist/manifest.json >/dev/null
          jq -e --arg sha "$JADX_SHA256" '.sources[] | select(.name == "jadx") | .sha256 == $sha' dist/manifest.json >/dev/null
          jq -e --arg sha "$APKTOOL_SHA256" '.sources[] | select(.name == "apktool") | .sha256 == $sha' dist/manifest.json >/dev/null

      - name: Verify final package
        run: |
          set -euxo pipefail
          unzip -t dist/AutoCrackApp-apk-dex-static-toolpack.zip
          test "$(unzip -Z1 dist/AutoCrackApp-apk-dex-static-toolpack.zip | wc -l)" -eq 2
          unzip -p dist/AutoCrackApp-apk-dex-static-toolpack.zip manifest.json \
            | jq -e '.commands | map(.name) == ["jadx", "apktool"]' >/dev/null

      - name: Upload reverse-analysis toolpack
        uses: actions/upload-artifact@v4
        with:
          name: AutoCrackApp-apk-dex-static-toolpack
          path: |
            dist/AutoCrackApp-apk-dex-static-toolpack.zip
            dist/AutoCrackApp-apk-dex-static-toolpack.zip.sha256
            dist/manifest.json
          if-no-files-found: error
          retention-days: 14

  build-perfetto-toolpack:
    name: Build verified Perfetto trace_processor package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PERFETTO_VERSION: "58.2"
      PERFETTO_LINUX_ARM64_SHA256: "a82bf4111a340a7ea8577bcfd62e014e8e81b9e6a35a3190f5415fb800051ab0"
      EXPECTED_PAYLOAD_SHA256: "25271c9f340962e9364c9abba00c1e57ee5c2a4b12ca551c327d640564f19a4b"
      EXPECTED_PAYLOAD_SIZE: "14087073"
      TOOLPACK_ID: perfetto-analysis
      TOOLPACK_VERSION: perfetto-58.2-autocrack-1.0.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl jq unzip zip file

      - name: Download and verify official Linux ARM64 Perfetto bundle
        run: |
          set -euxo pipefail
          mkdir -p dist/source dist/unpacked dist/payload/bin
          PERFETTO_URL="https://github.com/google/perfetto/releases/download/v${PERFETTO_VERSION}/linux-arm64.zip"
          curl --fail --location --retry 4 --retry-all-errors \
            --output dist/source/linux-arm64.zip "$PERFETTO_URL"
          printf '%s  %s\n' "$PERFETTO_LINUX_ARM64_SHA256" dist/source/linux-arm64.zip \
            | sha256sum --check --strict -
          unzip -t dist/source/linux-arm64.zip
          unzip -q dist/source/linux-arm64.zip -d dist/unpacked
          printf '%s' "$PERFETTO_URL" > dist/source/perfetto.url

      - name: Assemble deterministic trace_processor payload
        run: |
          set -euxo pipefail
          TRACE_PROCESSOR=$(find dist/unpacked -type f \( -name trace_processor -o -name trace_processor_shell \) -print -quit)
          test -n "$TRACE_PROCESSOR"
          cp "$TRACE_PROCESSOR" dist/payload/bin/trace_processor
          cp toolpacks/perfetto-analysis/SKILL.md dist/payload/SKILL.md
          chmod 0755 dist/payload/bin/trace_processor
          file dist/payload/bin/trace_processor | tee dist/source/trace-processor.file.txt
          grep -Eq 'ELF 64-bit.*(ARM aarch64|ARM64|aarch64)' dist/source/trace-processor.file.txt
          sha256sum dist/payload/bin/trace_processor > dist/source/trace-processor.binary.sha256

          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_STORED, ZipFile, ZipInfo

          root = Path("dist/payload")
          output = Path("dist/payload.zip")
          with ZipFile(output, "w", compression=ZIP_STORED) as archive:
              for path in sorted((p for p in root.rglob("*") if p.is_file()), key=lambda p: p.relative_to(root).as_posix()):
                  relative = path.relative_to(root).as_posix()
                  info = ZipInfo(relative, date_time=(1980, 1, 1, 0, 0, 0))
                  info.create_system = 3
                  info.external_attr = (0o100755 if relative == "bin/trace_processor" else 0o100644) << 16
                  info.compress_type = ZIP_STORED
                  archive.writestr(info, path.read_bytes())
          PY

          ACTUAL_PAYLOAD_SHA256=$(sha256sum dist/payload.zip | awk '{print $1}')
          ACTUAL_PAYLOAD_SIZE=$(stat -c '%s' dist/payload.zip)
          printf 'PERFETTO_PAYLOAD_SHA256=%s\nPERFETTO_PAYLOAD_SIZE=%s\n' \
            "$ACTUAL_PAYLOAD_SHA256" "$ACTUAL_PAYLOAD_SIZE" | tee dist/build-summary.txt
          test "$ACTUAL_PAYLOAD_SHA256" = "$EXPECTED_PAYLOAD_SHA256"
          test "$ACTUAL_PAYLOAD_SIZE" = "$EXPECTED_PAYLOAD_SIZE"

      - name: Generate pinned manifest and package
        run: |
          set -euxo pipefail
          PERFETTO_URL=$(cat dist/source/perfetto.url)
          export PERFETTO_URL
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = {
              "schemaVersion": 1,
              "id": os.environ["TOOLPACK_ID"],
              "title": "Perfetto trace analysis",
              "version": os.environ["TOOLPACK_VERSION"],
              "architecture": "arm64",
              "payloadEntry": "payload.zip",
              "payloadSha256": os.environ["EXPECTED_PAYLOAD_SHA256"],
              "payloadSizeBytes": int(os.environ["EXPECTED_PAYLOAD_SIZE"]),
              "requiredPaths": ["bin/trace_processor", "SKILL.md"],
              "commands": [{"name": "trace_processor", "relativePath": "bin/trace_processor"}],
              "selfTests": [{
                  "id": "trace-processor-help",
                  "title": "Perfetto trace_processor ARM64 CLI",
                  "command": "trace_processor --help >/dev/null",
                  "expectedExitCodes": [0],
                  "outputContains": [],
              }],
              "sources": [{
                  "name": "perfetto-linux-arm64",
                  "version": os.environ["PERFETTO_VERSION"],
                  "url": os.environ["PERFETTO_URL"],
                  "sha256": os.environ["PERFETTO_LINUX_ARM64_SHA256"],
              }],
          }
          Path("dist/manifest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          jq -e '.id == "perfetto-analysis" and .version == "perfetto-58.2-autocrack-1.0.0"' dist/manifest.json >/dev/null
          (
            cd dist
            zip -0 -q AutoCrackApp-perfetto-analysis-toolpack.zip manifest.json payload.zip
            sha256sum AutoCrackApp-perfetto-analysis-toolpack.zip > AutoCrackApp-perfetto-analysis-toolpack.zip.sha256
          )

      - name: Verify final package
        run: |
          set -euxo pipefail
          unzip -t dist/AutoCrackApp-perfetto-analysis-toolpack.zip
          test "$(unzip -Z1 dist/AutoCrackApp-perfetto-analysis-toolpack.zip | wc -l)" -eq 2
          unzip -p dist/AutoCrackApp-perfetto-analysis-toolpack.zip manifest.json \
            | jq -e '.commands | map(.name) == ["trace_processor"]' >/dev/null

      - name: Upload Perfetto analysis toolpack
        uses: actions/upload-artifact@v4
        with:
          name: AutoCrackApp-perfetto-analysis-toolpack
          path: |
            dist/AutoCrackApp-perfetto-analysis-toolpack.zip
            dist/AutoCrackApp-perfetto-analysis-toolpack.zip.sha256
            dist/manifest.json
            dist/build-summary.txt
            dist/source/trace-processor.binary.sha256
            dist/source/trace-processor.file.txt
          if-no-files-found: error
          retention-days: 14

  build-lief-toolpack:
    name: Build verified ARM64 LIEF static-analysis package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      LIEF_VERSION: "1.0.0"
      LIEF_WHEEL_SHA256: "95fb7dc84960068ab881bc681e646cab55f3d736c07bb07e91d5cbc8738885a7"
      EXPECTED_PAYLOAD_SHA256: "b2bb3a3a2fae53782bd1bc3bc357504bd7a1747dc782a2942944510b3fa34e78"
      EXPECTED_PAYLOAD_SIZE: "12246513"
      TOOLPACK_ID: lief-static
      TOOLPACK_VERSION: lief-1.0.0-autocrack-1.0.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl jq unzip zip file

      - name: Download and verify official PyPI ARM64 wheel
        run: |
          set -euxo pipefail
          mkdir -p dist/source dist/payload/bin dist/payload/libexec dist/payload/python
          PYPI_JSON=$(mktemp)
          curl --fail --location --retry 4 --retry-all-errors \
            --output "$PYPI_JSON" "https://pypi.org/pypi/lief/${LIEF_VERSION}/json"
          LIEF_URL=$(jq -r '.urls[] | select(.filename == "lief-1.0.0-cp311-cp311-manylinux_2_28_aarch64.whl") | .url' "$PYPI_JSON")
          test -n "$LIEF_URL" && test "$LIEF_URL" != null
          curl --fail --location --retry 4 --retry-all-errors --output dist/source/lief.whl "$LIEF_URL"
          printf '%s  %s\n' "$LIEF_WHEEL_SHA256" dist/source/lief.whl | sha256sum --check --strict -
          unzip -t dist/source/lief.whl
          printf '%s' "$LIEF_URL" > dist/source/lief.url

      - name: Assemble deterministic full-API LIEF payload
        run: |
          set -euxo pipefail
          unzip -q dist/source/lief.whl -d dist/payload/python
          cp toolpacks/lief-static/bin/lief-elf-report dist/payload/bin/lief-elf-report
          cp toolpacks/lief-static/libexec/lief_elf_report.py dist/payload/libexec/lief_elf_report.py
          cp toolpacks/lief-static/SKILL.md dist/payload/SKILL.md
          chmod 0755 dist/payload/bin/lief-elf-report dist/payload/libexec/lief_elf_report.py

          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_STORED, ZipFile, ZipInfo
          root = Path("dist/payload")
          output = Path("dist/payload.zip")
          executable = {"bin/lief-elf-report", "libexec/lief_elf_report.py"}
          with ZipFile(output, "w", compression=ZIP_STORED) as archive:
              for path in sorted((p for p in root.rglob("*") if p.is_file()), key=lambda p: p.relative_to(root).as_posix()):
                  relative = path.relative_to(root).as_posix()
                  info = ZipInfo(relative, date_time=(1980, 1, 1, 0, 0, 0))
                  info.create_system = 3
                  info.external_attr = (0o100755 if relative in executable else 0o100644) << 16
                  info.compress_type = ZIP_STORED
                  archive.writestr(info, path.read_bytes())
          PY

          ACTUAL_PAYLOAD_SHA256=$(sha256sum dist/payload.zip | awk '{print $1}')
          ACTUAL_PAYLOAD_SIZE=$(stat -c '%s' dist/payload.zip)
          printf 'LIEF_PAYLOAD_SHA256=%s\nLIEF_PAYLOAD_SIZE=%s\n' \
            "$ACTUAL_PAYLOAD_SHA256" "$ACTUAL_PAYLOAD_SIZE" | tee dist/lief-build-summary.txt
          test "$ACTUAL_PAYLOAD_SHA256" = "$EXPECTED_PAYLOAD_SHA256"
          test "$ACTUAL_PAYLOAD_SIZE" = "$EXPECTED_PAYLOAD_SIZE"

      - name: Run ARM64 LIEF runtime self-test
        run: |
          set -euxo pipefail
          docker run --rm --platform linux/arm64 \
            -v "$PWD/dist/payload:/opt/lief-toolpack:ro" \
            python:3.11-slim-bookworm /bin/bash -euxc '
              export PATH=/opt/lief-toolpack/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              export PYTHONPATH=/opt/lief-toolpack/python
              python3 -c "import lief; assert lief.__version__ == \"1.0.0-fe54643f\" or lief.__version__.startswith(\"1.0.0\"); print(lief.__version__)"
              lief-elf-report --self-test | grep -F "LIEF_STATIC_SELF_TEST_OK version=1.0.0"
              lief-elf-report /bin/ls > /tmp/lief-ls.json
              python3 -c "import json; x=json.load(open(\"/tmp/lief-ls.json\")); assert x[\"format\"] == \"ELF\"; assert x[\"counts\"][\"sections\"] > 0"
            '

      - name: Generate pinned manifest and package
        run: |
          set -euxo pipefail
          LIEF_URL=$(cat dist/source/lief.url)
          export LIEF_URL
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = {
              "schemaVersion": 1,
              "id": os.environ["TOOLPACK_ID"],
              "title": "LIEF full Python API and ELF report helper",
              "version": os.environ["TOOLPACK_VERSION"],
              "architecture": "arm64",
              "payloadEntry": "payload.zip",
              "payloadSha256": os.environ["EXPECTED_PAYLOAD_SHA256"],
              "payloadSizeBytes": int(os.environ["EXPECTED_PAYLOAD_SIZE"]),
              "requiredPaths": ["bin/lief-elf-report", "libexec/lief_elf_report.py", "python/lief/__init__.py", "SKILL.md"],
              "commands": [{"name": "lief-elf-report", "relativePath": "bin/lief-elf-report"}],
              "selfTests": [
                  {
                      "id": "lief-python-import",
                      "title": "Complete LIEF Python API import",
                      "command": "PYTHONDONTWRITEBYTECODE=1 python3 -B -c \"import lief; print(lief.__version__)\"",
                      "expectedExitCodes": [0],
                      "outputContains": ["1.0.0"],
                  },
                  {
                      "id": "lief-static-self-test",
                      "title": "Optional bounded ELF report helper",
                      "command": "lief-elf-report --self-test",
                      "expectedExitCodes": [0],
                      "outputContains": ["LIEF_STATIC_SELF_TEST_OK version=1.0.0"],
                  },
              ],
              "sources": [{
                  "name": "lief-python-aarch64",
                  "version": os.environ["LIEF_VERSION"],
                  "url": os.environ["LIEF_URL"],
                  "sha256": os.environ["LIEF_WHEEL_SHA256"],
              }],
          }
          Path("dist/manifest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          (
            cd dist
            zip -0 -q AutoCrackApp-lief-static-toolpack.zip manifest.json payload.zip
            sha256sum AutoCrackApp-lief-static-toolpack.zip > AutoCrackApp-lief-static-toolpack.zip.sha256
          )

      - name: Upload LIEF static-analysis toolpack
        uses: actions/upload-artifact@v4
        with:
          name: AutoCrackApp-lief-static-toolpack
          path: |
            dist/AutoCrackApp-lief-static-toolpack.zip
            dist/AutoCrackApp-lief-static-toolpack.zip.sha256
            dist/manifest.json
            dist/lief-build-summary.txt
            dist/source/lief.whl
            dist/source/lief.url
          if-no-files-found: error
          retention-days: 14
