name: Build ELF native analysis toolpack

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elf-toolpack-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-elf-native-toolpack:
    name: Build verified ARM64 ELF analysis package
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      CHECKSEC_VERSION: "3.2.0"
      CHECKSEC_SHA256: "4834ac10b87a4faa143fdbf8cc7458be68dbeb9d2e2ec005b669ced7eae9615d"
      TOOLPACK_ID: elf-native-static
      TOOLPACK_VERSION: checksec-3.2.0_autocrack-1.0.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install host packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl jq python3

      - name: Download and verify pinned Checksec release
        run: |
          set -euxo pipefail
          mkdir -p dist/sources dist/payload/bin
          CHECKSEC_URL="https://github.com/slimm609/checksec/releases/download/${CHECKSEC_VERSION}/checksec_${CHECKSEC_VERSION}_arm64.deb"
          curl --fail --location --retry 4 --retry-all-errors \
            --output dist/sources/checksec.deb "$CHECKSEC_URL"
          printf '%s  %s\n' "$CHECKSEC_SHA256" dist/sources/checksec.deb \
            | sha256sum --check --strict -
          dpkg-deb -x dist/sources/checksec.deb dist/checksec-root
          test -f dist/checksec-root/usr/bin/checksec
          cp dist/checksec-root/usr/bin/checksec dist/payload/bin/checksec
          chmod 0755 dist/payload/bin/checksec
          printf '%s' "$CHECKSEC_URL" > dist/sources/checksec.url

      - name: Add AutoCrack ELF report commands
        run: |
          set -euxo pipefail
          cat > dist/payload/bin/elf-deps <<'EOF'
          cp toolpacks/elf-native-static/SKILL.md dist/payload/SKILL.md
          #!/bin/sh
          set -eu

          if [ "${1:-}" = "--self-test" ]; then
            command -v readelf >/dev/null
            echo ELF_DEPS_SELF_TEST_OK
            exit 0
          fi

          if [ "$#" -ne 1 ]; then
            echo "Usage: elf-deps <ELF-or-SO-file>" >&2
            exit 2
          fi

          TARGET=$1
          [ -f "$TARGET" ] || { echo "ELF file not found: $TARGET" >&2; exit 3; }
          file "$TARGET" | grep -q 'ELF' || { echo "Not an ELF file: $TARGET" >&2; exit 4; }

          echo "ELF dependencies: $TARGET"
          readelf -dW "$TARGET" | awk '
            /\(SONAME\)/ || /\(NEEDED\)/ || /\(RPATH\)/ || /\(RUNPATH\)/ ||
            /\(FLAGS\)/ || /\(FLAGS_1\)/ { print }
          '
          EOF

          cat > dist/payload/bin/elf-report <<'EOF'
          #!/bin/sh
          set -eu

          if [ "${1:-}" = "--self-test" ]; then
            for command_name in file sha256sum readelf objdump nm strings patchelf checksec; do
              command -v "$command_name" >/dev/null || {
                echo "Missing required command: $command_name" >&2
                exit 10
              }
            done
            echo ELF_REPORT_SELF_TEST_OK
            exit 0
          fi

          if [ "$#" -lt 1 ] || [ "$#" -gt 2 ]; then
            echo "Usage: elf-report <ELF-or-SO-file> [output-directory-under-/workspace]" >&2
            exit 2
          fi

          TARGET=$1
          [ -f "$TARGET" ] || { echo "ELF file not found: $TARGET" >&2; exit 3; }
          file "$TARGET" | grep -q 'ELF' || { echo "Not an ELF file: $TARGET" >&2; exit 4; }

          BASE=$(basename -- "$TARGET")
          SAFE_BASE=$(printf '%s' "$BASE" | tr -c 'A-Za-z0-9._-' '_')
          OUT=${2:-/workspace/elf-report-$SAFE_BASE}
          case "$OUT" in
            /workspace/*) ;;
            *) echo "Output directory must be under /workspace: $OUT" >&2; exit 5 ;;
          esac

          mkdir -p "$OUT"
          sha256sum "$TARGET" > "$OUT/sha256.txt"
          file "$TARGET" > "$OUT/file.txt"
          readelf -hW "$TARGET" > "$OUT/elf-header.txt"
          readelf -lW "$TARGET" > "$OUT/program-headers.txt"
          readelf -SW "$TARGET" > "$OUT/sections.txt"
          readelf -dW "$TARGET" > "$OUT/dynamic.txt" 2> "$OUT/dynamic.stderr" || true
          readelf -sW "$TARGET" > "$OUT/symbols.txt" 2> "$OUT/symbols.stderr" || true
          readelf -rW "$TARGET" > "$OUT/relocations.txt" 2> "$OUT/relocations.stderr" || true
          objdump -p "$TARGET" > "$OUT/objdump-private.txt" 2> "$OUT/objdump-private.stderr" || true
          nm -D -C "$TARGET" > "$OUT/dynamic-symbols-demangled.txt" 2> "$OUT/nm.stderr" || true
          strings -a -n 6 "$TARGET" > "$OUT/strings-min6.txt"
          patchelf --print-soname "$TARGET" > "$OUT/soname.txt" 2> "$OUT/soname.stderr" || true
          patchelf --print-needed "$TARGET" > "$OUT/needed.txt" 2> "$OUT/needed.stderr" || true

          if ! checksec file "$TARGET" --output json > "$OUT/checksec.json" 2> "$OUT/checksec.stderr"; then
            checksec file "$TARGET" > "$OUT/checksec.txt" 2>> "$OUT/checksec.stderr" || true
          fi

          {
            echo "AutoCrackApp ELF report"
            echo "input=$TARGET"
            echo "output=$OUT"
            echo "sha256=$(awk '{print $1}' "$OUT/sha256.txt")"
            echo "file=$(cat "$OUT/file.txt")"
          } > "$OUT/summary.txt"

          echo "ELF_REPORT_OK output=$OUT"
          EOF

          chmod 0755 dist/payload/bin/elf-deps dist/payload/bin/elf-report

      - name: Build deterministic payload and manifest
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import stat
          import zipfile
          from pathlib import Path

          payload_root = Path("dist/payload")
          payload_zip = Path("dist/payload.zip")
          fixed_time = (1980, 1, 1, 0, 0, 0)

          with zipfile.ZipFile(payload_zip, "w", compression=zipfile.ZIP_STORED) as archive:
              for path in sorted(p for p in payload_root.rglob("*") if p.is_file()):
                  relative = path.relative_to(payload_root).as_posix()
                  info = zipfile.ZipInfo(relative, fixed_time)
                  info.create_system = 3
                  info.compress_type = zipfile.ZIP_STORED
                  mode = 0o755 if relative.startswith("bin/") else 0o644
                  info.external_attr = (stat.S_IFREG | mode) << 16
                  archive.writestr(info, path.read_bytes())

          payload_bytes = payload_zip.read_bytes()
          payload_sha = hashlib.sha256(payload_bytes).hexdigest()
          payload_size = len(payload_bytes)
          checksec_url = Path("dist/sources/checksec.url").read_text(encoding="utf-8")

          manifest = {
              "schemaVersion": 1,
              "id": os.environ["TOOLPACK_ID"],
              "title": "ELF and native static analysis",
              "version": os.environ["TOOLPACK_VERSION"],
              "architecture": "arm64",
              "payloadEntry": "payload.zip",
              "payloadSha256": payload_sha,
              "payloadSizeBytes": payload_size,
              "requiredPaths": ["bin/checksec", "bin/elf-deps", "bin/elf-report", "SKILL.md"],
              "commands": [
                  {"name": "checksec", "relativePath": "bin/checksec"},
                  {"name": "elf-deps", "relativePath": "bin/elf-deps"},
                  {"name": "elf-report", "relativePath": "bin/elf-report"},
              ],
              "selfTests": [
                  {
                      "id": "checksec-version",
                      "title": "Checksec ARM64",
                      "command": "checksec --version",
                      "expectedExitCodes": [0],
                      "outputContains": [os.environ["CHECKSEC_VERSION"]],
                  },
                  {
                      "id": "elf-deps-self-test",
                      "title": "ELF dependency reporter",
                      "command": "elf-deps --self-test",
                      "expectedExitCodes": [0],
                      "outputContains": ["ELF_DEPS_SELF_TEST_OK"],
                  },
                  {
                      "id": "elf-report-self-test",
                      "title": "ELF full report generator",
                      "command": "elf-report --self-test",
                      "expectedExitCodes": [0],
                      "outputContains": ["ELF_REPORT_SELF_TEST_OK"],
                  },
              ],
              "sources": [
                  {
                      "name": "checksec",
                      "version": os.environ["CHECKSEC_VERSION"],
                      "url": checksec_url,
                      "sha256": os.environ["CHECKSEC_SHA256"],
                  }
              ],
          }
          Path("dist/manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          Path("dist/payload.sha256").write_text(payload_sha + "\n", encoding="utf-8")
          Path("dist/payload.size").write_text(str(payload_size) + "\n", encoding="utf-8")
          print(f"ELF_PAYLOAD_SHA256={payload_sha}")
          print(f"ELF_PAYLOAD_SIZE={payload_size}")
          PY

      - name: Run ARM64 command and report self-tests
        run: |
          set -euxo pipefail
          docker run --rm --platform linux/arm64 \
            -v "$PWD/dist/payload:/opt/elf-toolpack:ro" \
            debian:bookworm-slim /bin/bash -euxc '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                bash binutils file patchelf coreutils grep sed gawk
              export PATH=/opt/elf-toolpack/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              mkdir -p /workspace
              checksec --version | grep -F "3.2.0"
              elf-deps --self-test | grep -F ELF_DEPS_SELF_TEST_OK
              elf-report --self-test | grep -F ELF_REPORT_SELF_TEST_OK
              elf-deps /bin/ls | grep -F "ELF dependencies"
              elf-report /bin/ls /workspace/ls-report | grep -F ELF_REPORT_OK
              test -s /workspace/ls-report/elf-header.txt
              test -s /workspace/ls-report/program-headers.txt
              test -s /workspace/ls-report/strings-min6.txt
              test -s /workspace/ls-report/summary.txt
            '

      - name: Package and verify final toolpack
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import hashlib
          import stat
          import zipfile
          from pathlib import Path

          output = Path("dist/AutoCrackApp-elf-native-static-toolpack.zip")
          fixed_time = (1980, 1, 1, 0, 0, 0)
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_STORED) as archive:
              for name in ("manifest.json", "payload.zip"):
                  path = Path("dist") / name
                  info = zipfile.ZipInfo(name, fixed_time)
                  info.create_system = 3
                  info.compress_type = zipfile.ZIP_STORED
                  info.external_attr = (stat.S_IFREG | 0o644) << 16
                  archive.writestr(info, path.read_bytes())
          digest = hashlib.sha256(output.read_bytes()).hexdigest()
          Path(str(output) + ".sha256").write_text(
              f"{digest}  {output.name}\n", encoding="utf-8"
          )
          print(f"ELF_TOOLPACK_SHA256={digest}")
          PY

          unzip -t dist/AutoCrackApp-elf-native-static-toolpack.zip
          test "$(unzip -Z1 dist/AutoCrackApp-elf-native-static-toolpack.zip | wc -l)" -eq 2
          jq -e '.commands | map(.name) == ["checksec", "elf-deps", "elf-report"]' \
            dist/manifest.json >/dev/null

      - name: Upload ELF native toolpack
        uses: actions/upload-artifact@v4
        with:
          name: AutoCrackApp-elf-native-static-toolpack
          path: |
            dist/AutoCrackApp-elf-native-static-toolpack.zip
            dist/AutoCrackApp-elf-native-static-toolpack.zip.sha256
            dist/manifest.json
            dist/payload.sha256
            dist/payload.size
          if-no-files-found: error
          retention-days: 14
