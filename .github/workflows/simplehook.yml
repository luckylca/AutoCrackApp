name: Build SimpleHook toolpack and Android modules

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/simplehook.yml
      - settings.gradle.kts
      - gradle/libs.versions.toml
      - simplehook-core/**
      - simplehook-runtime/**
      - autocrack-runtime/**
      - runtime-inspector-test-app/**
      - xposed-api-stubs/**
      - toolpacks/simplehook/**
      - app/src/main/java/com/luckylca/autocrack/runtime/BuiltInToolpackTrustPolicy.kt
      - app/src/test/java/com/luckylca/autocrack/runtime/SimpleHookToolpackTrustPolicyTest.kt
  push:
    branches:
      - main
      - codex/frida-capabilities-1.0.4
    paths:
      - .github/workflows/simplehook.yml
      - settings.gradle.kts
      - gradle/libs.versions.toml
      - simplehook-core/**
      - simplehook-runtime/**
      - autocrack-runtime/**
      - runtime-inspector-test-app/**
      - xposed-api-stubs/**
      - toolpacks/simplehook/**
      - app/src/main/java/com/luckylca/autocrack/runtime/BuiltInToolpackTrustPolicy.kt
      - app/src/test/java/com/luckylca/autocrack/runtime/SimpleHookToolpackTrustPolicyTest.kt

permissions:
  contents: read

concurrency:
  group: simplehook-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint, build, and package SimpleHook 0.1.1
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Run SimpleHook Python tests
        run: |
          python3 -m py_compile \
            toolpacks/simplehook/libexec/simplehook_cli.py \
            toolpacks/simplehook/build_toolpack.py
          python3 -m unittest discover -s toolpacks/simplehook/tests -v

      - name: Test and build Android modules
        run: |
          ./gradlew --no-daemon --max-workers=1 --stacktrace \
            :simplehook-core:testDebugUnitTest \
            :simplehook-core:lintDebug \
            :autocrack-runtime:assembleDebug \
            :runtime-inspector-test-app:testDebugUnitTest \
            :runtime-inspector-test-app:lintDebug \
            :runtime-inspector-test-app:assembleDebug
          ./gradlew --no-daemon --max-workers=1 --stacktrace \
            :app:testDebugUnitTest --tests com.luckylca.autocrack.runtime.SimpleHookToolpackTrustPolicyTest

      - name: Build deterministic toolpack
        run: |
          python3 toolpacks/simplehook/build_toolpack.py | tee /tmp/simplehook-build-summary.txt
          cp /tmp/simplehook-build-summary.txt toolpacks/simplehook/dist/build-summary.txt
          unzip -t toolpacks/simplehook/dist/simplehook-toolpack-0.1.1.zip
          jq -e '
            .schemaVersion == 2 and
            .id == "simplehook" and
            .version == "simplehook-0.1.1" and
            .payloadSha256 == "28adb59057472533286bd091f7a53abf68915015dd471cd289bc887febfd384c" and
            .payloadSizeBytes == 44254 and
            .sources[0].sha256 == "af22a087912fd465b10d5f5bdef651ce38ced92341f40d47b60d2771cb2ed88e" and
            .requires.runtime == ">=1.0.0" and
            (.requires.capabilities | index("hook.reload")) != null and
            (.requires.capabilities | index("hook.inspect")) != null and
            (.requires.commands | index("android-shell")) != null and
            (.requiredPaths | index("SKILL.md")) != null and
            ([.commands[].name] | index("simplehook")) != null
          ' toolpacks/simplehook/dist/manifest.json >/dev/null

      - name: Verify Android module contents
        run: |
          RUNTIME_APK=autocrack-runtime/build/outputs/apk/debug/autocrack-runtime-debug.apk
          TEST_APK=runtime-inspector-test-app/build/outputs/apk/debug/runtime-inspector-test-app-debug.apk
          test -s "$RUNTIME_APK"
          test -s "$TEST_APK"
          unzip -p "$RUNTIME_APK" assets/xposed_init | grep -Fx 'com.luckylca.autocrack.runtime.AutoCrackXposedEntry'
          ! unzip -l "$RUNTIME_APK" | grep -F 'de/robv/android/xposed/'

      - name: Assemble release artifacts and checksums
        run: |
          mkdir -p dist/simplehook-0.1.1
          cp toolpacks/simplehook/dist/simplehook-toolpack-0.1.1.zip dist/simplehook-0.1.1/
          cp toolpacks/simplehook/dist/manifest.json dist/simplehook-0.1.1/manifest.json
          cp autocrack-runtime/build/outputs/apk/debug/autocrack-runtime-debug.apk \
            dist/simplehook-0.1.1/AutoCrackRuntime.apk
          cp runtime-inspector-test-app/build/outputs/apk/debug/runtime-inspector-test-app-debug.apk \
            dist/simplehook-0.1.1/RuntimeInspectorTestApp.apk
          cd dist/simplehook-0.1.1
          sha256sum simplehook-toolpack-0.1.1.zip AutoCrackRuntime.apk \
            RuntimeInspectorTestApp.apk manifest.json > SHA256SUMS

      - name: Upload SimpleHook package
        uses: actions/upload-artifact@v4
        with:
          name: simplehook-0.1.1
          path: dist/simplehook-0.1.1/
          if-no-files-found: error
          retention-days: 30

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simplehook-0.1.1-reports
          path: |
            simplehook-core/build/reports/
            autocrack-runtime/build/reports/
            runtime-inspector-test-app/build/reports/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
