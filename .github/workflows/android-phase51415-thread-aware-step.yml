name: Android Phase 5.14.15 thread-aware step

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-phase51415-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build thread-aware bounded-step APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply phase 5.14.14 and 5.14.15 patches
        run: |
          set -euxo pipefail
          python3 scripts/apply_phase51414_bounded_step_recovery.py
          python3 scripts/apply_phase51415_thread_aware_step.py
          grep -F 'versionName = "0.5.14.15-phase5.14-thread-aware-step"' app/build.gradle.kts
          grep -F 'android-llvm-r522817_autocrack-1.3.0-seize-runtime-stop' \
            app/src/main/java/com/luckylca/autocrack/runtime/HostDebuggerSessionManager.kt
          grep -F 'STEP_WAIT_TIMEOUT_MILLIS = 2_000' \
            app/src/main/java/com/luckylca/autocrack/runtime/HostDebuggerRemoteClient.kt
          grep -F 'fun queryThreads(' \
            app/src/main/java/com/luckylca/autocrack/runtime/HostDebuggerRemoteClient.kt
          grep -F 'fun selectGeneralThread(' \
            app/src/main/java/com/luckylca/autocrack/runtime/HostDebuggerRemoteClient.kt
          grep -F 'fun step(threadId: String)' \
            app/src/main/java/com/luckylca/autocrack/runtime/HostDebuggerRemoteClient.kt
          grep -F 'stepCompleted' \
            app/src/main/java/com/luckylca/autocrack/runtime/HostDebuggerControlBridge.kt \
            app/src/main/java/com/luckylca/autocrack/ui/DebuggerSessionScreen.kt
          grep -F 'selectedThreadId' \
            app/src/main/java/com/luckylca/autocrack/runtime/HostDebuggerControlBridge.kt \
            app/src/main/java/com/luckylca/autocrack/ui/DebuggerSessionScreen.kt
          ! grep -R -F 'writeRegister(' app/src/main/java/com/luckylca/autocrack/runtime/HostDebuggerRemoteClient.kt
          ! grep -R -F 'writeMemory(' app/src/main/java/com/luckylca/autocrack/runtime/HostDebuggerRemoteClient.kt
          ! grep -R -F 'insertBreakpoint(' app/src/main/java/com/luckylca/autocrack/runtime/HostDebuggerRemoteClient.kt
          ! grep -R -F 'sendRawPacket(' app/src/main/java/com/luckylca/autocrack/runtime/HostDebuggerRemoteClient.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK, and CMake packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.3.13750724" \
            "cmake;3.22.1"

      - name: Lint, unit test, and assemble debug APK
        run: gradle --no-daemon --stacktrace clean lintDebug testDebugUnitTest assembleDebug

      - name: Verify packaged safety boundary
        run: |
          set -euxo pipefail
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F 'lib/arm64-v8a/libautocrack_pty.so'
          unzip -p app/build/outputs/apk/debug/app-debug.apk \
            assets/runtime/dynamic-host-tool-catalog-v1.json \
            | jq -e '
                .catalogVersion == "0.5.14.15" and
                .safetyBoundary.defaultOperationMode == "read_only" and
                .safetyBoundary.attachAllowed == true and
                .safetyBoundary.debuggerExecutionControlAllowed == true and
                .safetyBoundary.registerReadAllowed == true and
                .safetyBoundary.registerWriteAllowed == false and
                .safetyBoundary.memoryReadAllowed == true and
                .safetyBoundary.memoryWriteAllowed == false and
                .safetyBoundary.breakpointAllowed == false and
                .safetyBoundary.rawDebuggerPacketAllowed == false and
                .safetyBoundary.signalsAllowed == false and
                (.tools[] | select(.id == "host.debugger.lldb_server_session") |
                  .requiresToolpack.version == "android-llvm-r522817_autocrack-1.3.0-seize-runtime-stop")
              ' >/dev/null

      - name: Prepare distributable APK
        run: |
          set -euxo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
            dist/AutoCrackApp-0.5.14.15-thread-aware-step-debug.apk
          cd dist
          sha256sum AutoCrackApp-0.5.14.15-thread-aware-step-debug.apk \
            > AutoCrackApp-0.5.14.15-thread-aware-step-debug.apk.sha256

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoCrackApp-0.5.14.15-thread-aware-step-debug
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AutoCrackApp-0.5.14.15-thread-aware-step-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
