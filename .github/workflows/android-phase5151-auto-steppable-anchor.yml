name: Android Phase 5.15.1 auto steppable anchor

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-phase5151-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build automatic thread/PC anchor APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply debugger patch chain through Phase 5.15.1
        run: |
          set -euxo pipefail
          python3 scripts/apply_phase51414_bounded_step_recovery.py
          python3 scripts/apply_phase51415_thread_aware_step.py
          python3 scripts/apply_phase51415_generated_source_fix.py
          python3 scripts/apply_phase5150_typed_hw_breakpoints.py
          python3 scripts/apply_phase5151_auto_steppable_anchor.py

          grep -F 'versionName = "0.5.15.1-phase5.15-auto-steppable-anchor"' app/build.gradle.kts
          grep -F 'android-llvm-r522817_autocrack-1.3.0-seize-runtime-stop' \
            app/src/main/java/com/luckylca/autocrack/runtime/HostDebuggerSessionManager.kt
          grep -F 'fun autoPrepareSteppableAnchor()' \
            app/src/main/java/com/luckylca/autocrack/runtime/HostDebuggerControlBridge.kt
          grep -F 'directMainThreadId = targetPid.toString(16)' \
            app/src/main/java/com/luckylca/autocrack/runtime/HostDebuggerControlBridge.kt
          grep -F 'GdbRemoteRegisterValueDecoder.unsignedLittleEndianLong' \
            app/src/main/java/com/luckylca/autocrack/runtime/HostDebuggerControlBridge.kt
          grep -F 'mutable.selectedThreadId = stoppedThreadId' \
            app/src/main/java/com/luckylca/autocrack/runtime/HostDebuggerControlBridge.kt
          grep -F 'autoAnchorStopObserved' \
            app/src/main/java/com/luckylca/autocrack/runtime/HostDebuggerControlBridge.kt \
            app/src/main/java/com/luckylca/autocrack/ui/DebuggerSessionScreen.kt
          grep -F '自动选择线程 + 地址并运行' \
            app/src/main/java/com/luckylca/autocrack/ui/DebuggerSessionScreen.kt
          grep -F '"auto_steppable_anchor"' app/src/main/assets/runtime/dynamic-host-tool-catalog-v1.json

          ! grep -R -F 'writeRegister(' app/src/main/java/com/luckylca/autocrack/runtime/HostDebuggerRemoteClient.kt
          ! grep -R -F 'writeMemory(' app/src/main/java/com/luckylca/autocrack/runtime/HostDebuggerRemoteClient.kt
          ! grep -R -F 'sendRawPacket(' app/src/main/java/com/luckylca/autocrack/runtime/HostDebuggerRemoteClient.kt
          ! grep -R -F '"Z0,' app/src/main/java/com/luckylca/autocrack/runtime/HostDebuggerRemoteClient.kt
          ! grep -R -F '"z0,' app/src/main/java/com/luckylca/autocrack/runtime/HostDebuggerRemoteClient.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK, and CMake packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.3.13750724" \
            "cmake;3.22.1"

      - name: Lint, unit test, and assemble debug APK
        run: gradle --no-daemon --stacktrace clean lintDebug testDebugUnitTest assembleDebug

      - name: Verify packaged Phase 5.15.1 safety boundary
        run: |
          set -euxo pipefail
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F 'lib/arm64-v8a/libautocrack_pty.so'
          unzip -p app/build/outputs/apk/debug/app-debug.apk \
            assets/runtime/dynamic-host-tool-catalog-v1.json \
            | jq -e '
                .catalogVersion == "0.5.15.1" and
                .safetyBoundary.defaultOperationMode == "read_only" and
                .safetyBoundary.attachAllowed == true and
                .safetyBoundary.debuggerExecutionControlAllowed == true and
                .safetyBoundary.registerReadAllowed == true and
                .safetyBoundary.registerWriteAllowed == false and
                .safetyBoundary.memoryReadAllowed == true and
                .safetyBoundary.memoryWriteAllowed == false and
                .safetyBoundary.breakpointAllowed == true and
                .safetyBoundary.breakpointKinds == ["hardware_execution"] and
                .safetyBoundary.rawDebuggerPacketAllowed == false and
                .safetyBoundary.signalsAllowed == false and
                ([.tools[] | select(.id == "host.debugger.client_control") | .operations[].id] | index("auto_steppable_anchor") != null) and
                (.tools[] | select(.id == "host.debugger.lldb_server_session") |
                  .requiresToolpack.version == "android-llvm-r522817_autocrack-1.3.0-seize-runtime-stop")
              ' >/dev/null

      - name: Prepare distributable APK
        run: |
          set -euxo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
            dist/AutoCrackApp-0.5.15.1-auto-steppable-anchor-debug.apk
          cd dist
          sha256sum AutoCrackApp-0.5.15.1-auto-steppable-anchor-debug.apk \
            > AutoCrackApp-0.5.15.1-auto-steppable-anchor-debug.apk.sha256

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoCrackApp-0.5.15.1-auto-steppable-anchor-debug
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AutoCrackApp-0.5.15.1-auto-steppable-anchor-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
