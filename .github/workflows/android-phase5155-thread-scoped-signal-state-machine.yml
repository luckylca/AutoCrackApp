name: Android Phase 5.15.5 thread-scoped signal state machine

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-phase5155-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build thread-scoped signal-state APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply debugger patch chain through Phase 5.15.5
        run: |
          set -euxo pipefail
          python3 scripts/apply_phase51414_bounded_step_recovery.py
          python3 scripts/apply_phase51415_thread_aware_step.py
          python3 scripts/apply_phase51415_generated_source_fix.py
          python3 scripts/apply_phase5150_typed_hw_breakpoints.py
          python3 scripts/apply_phase5151_auto_steppable_anchor.py
          python3 scripts/apply_phase5152_automatic_code_context.py
          python3 scripts/apply_phase5152_generated_source_fix.py
          python3 scripts/apply_phase5153_live_auto_observation_timeline.py
          python3 scripts/apply_phase5154_thread_aware_compat.py
          python3 scripts/apply_phase5154_exact_signal_passthrough.py
          python3 scripts/apply_phase5155_thread_scoped_signal_state_machine.py

          grep -F 'versionName = "0.5.15.5-phase5.15-thread-scoped-signal-state-machine"' app/build.gradle.kts
          grep -F 'return "vCont;C${signal.toString(16).padStart(2, '\''0'\'')}:$stoppedThreadId;c"' app/src/main/java/com/luckylca/autocrack/runtime/HostDebuggerRemoteClient.kt
          grep -F 'fun isAutoPassableTargetSignal(stopReply: String): Boolean' app/src/main/java/com/luckylca/autocrack/runtime/HostDebuggerRemoteClient.kt
          grep -F 'auto_live_exact_thread_scoped_signal_passthrough' app/src/main/java/com/luckylca/autocrack/runtime/HostDebuggerControlBridge.kt
          grep -F 'autoSignalPassthroughScope' app/src/main/java/com/luckylca/autocrack/runtime/HostDebuggerControlBridge.kt
          grep -F 'stoppedSignalPassthroughScope' app/src/main/assets/runtime/dynamic-host-tool-catalog-v1.json

          ! grep -R -F 'return "vCont;C${signal.toString(16).padStart(2, '\''0'\'')}"' app/src/main/java/com/luckylca/autocrack/runtime/HostDebuggerRemoteClient.kt
          ! grep -R -F 'writeRegister(' app/src/main/java/com/luckylca/autocrack/runtime/HostDebuggerRemoteClient.kt
          ! grep -R -F 'writeMemory(' app/src/main/java/com/luckylca/autocrack/runtime/HostDebuggerRemoteClient.kt
          ! grep -R -F 'sendRawPacket(' app/src/main/java/com/luckylca/autocrack/runtime/HostDebuggerRemoteClient.kt
          ! grep -R -F '"Z0,' app/src/main/java/com/luckylca/autocrack/runtime/HostDebuggerRemoteClient.kt
          ! grep -R -F '"z0,' app/src/main/java/com/luckylca/autocrack/runtime/HostDebuggerRemoteClient.kt
          ! grep -R -F 'kill(' app/src/main/java/com/luckylca/autocrack/runtime/HostDebuggerControlBridge.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK, and CMake packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.3.13750724" \
            "cmake;3.22.1"

      - name: Lint, unit test, and assemble debug APK
        run: gradle --no-daemon --stacktrace clean lintDebug testDebugUnitTest assembleDebug

      - name: Verify packaged Phase 5.15.5 safety boundary
        run: |
          set -euxo pipefail
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F 'lib/arm64-v8a/libautocrack_pty.so'
          unzip -p app/build/outputs/apk/debug/app-debug.apk \
            assets/runtime/dynamic-host-tool-catalog-v1.json \
            | jq -e '
                .catalogVersion == "0.5.15.5" and
                .safetyBoundary.defaultOperationMode == "read_only" and
                .safetyBoundary.attachAllowed == true and
                .safetyBoundary.debuggerExecutionControlAllowed == true and
                .safetyBoundary.registerReadAllowed == true and
                .safetyBoundary.registerWriteAllowed == false and
                .safetyBoundary.memoryReadAllowed == true and
                .safetyBoundary.memoryWriteAllowed == false and
                .safetyBoundary.breakpointAllowed == true and
                .safetyBoundary.breakpointKinds == ["hardware_execution"] and
                .safetyBoundary.rawDebuggerPacketAllowed == false and
                .safetyBoundary.signalsAllowed == false and
                .safetyBoundary.stoppedSignalPassthroughAllowed == true and
                .safetyBoundary.stoppedSignalPassthroughScope == "stopped_thread_only" and
                .safetyBoundary.explicitSignalReasonTrapPassthroughAllowed == true and
                (.tools[] | select(.id == "host.debugger.lldb_server_session") |
                  .requiresToolpack.version == "android-llvm-r522817_autocrack-1.3.0-seize-runtime-stop")
              ' >/dev/null

      - name: Prepare distributable APK
        run: |
          set -euxo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
            dist/AutoCrackApp-0.5.15.5-thread-scoped-signal-state-machine-debug.apk
          cd dist
          sha256sum AutoCrackApp-0.5.15.5-thread-scoped-signal-state-machine-debug.apk \
            > AutoCrackApp-0.5.15.5-thread-scoped-signal-state-machine-debug.apk.sha256

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoCrackApp-0.5.15.5-thread-scoped-signal-state-machine-debug
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AutoCrackApp-0.5.15.5-thread-scoped-signal-state-machine-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
